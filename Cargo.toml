[package]
name = "litemigration"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1"
sqlx = { version = "0.8", features = ["postgres", "sqlite"] }


[dev-dependencies]
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-native-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }


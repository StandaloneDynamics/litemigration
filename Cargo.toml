[package]
name = "litemigration"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = {version = "0.40.2", optional = true}
postgres = { version = "0.19", optional = true }
log = "0.4"

[features]
default = ["sqlite", "postgres"]

sqlite = ["dep:rusqlite"]
postgres = ["dep:postgres"]


[dev-dependencies]
tempfile = "3"
testcontainers-modules = { version = "0.15.0", features = ["blocking", "postgres"] }
